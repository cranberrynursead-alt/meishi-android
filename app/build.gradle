plugins { id 'com.android.application' }
android {
    namespace 'jp.cranberry.meishi'
    compileSdk 34
    defaultConfig {
        applicationId 'jp.cranberry.meishi'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        shared {
            storeFile file('../signing.jks')
            storePassword 'meishitouroku'
            keyAlias 'meishi'
            keyPassword 'meishitouroku'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.shared }
        debug { signingConfig signingConfigs.shared }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
