name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/cache@v4
        with:
          path: signing.jks
          key: signing-key-v1
      - name: Create signing key if missing
        run: test -f signing.jks || keytool -genkeypair -keystore signing.jks -storepass meishitouroku -keypass meishitouroku -alias meishi -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Meishi Touroku, O=Cranberry"
      - run: gradle --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk meishi.apk
      - name: Write version.txt for in-app update
        run: |
          code=$(grep -oP "versionCode \K[0-9]+" app/build.gradle)
          name=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "$code $name" > version.txt
          cat version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: meishi.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: |
            meishi.apk
            version.txt
